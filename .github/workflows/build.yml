name: build

# Builds the image on every push and pull request. When (and only when) the repository
# is PUBLIC and the event is a push to the default branch or a tag, it also publishes the
# image to this repository's own GHCR package. While the repository is private the publish
# step is skipped, so nothing is ever pushed to a public package by accident.
#
# Designed to run on a public repository's free Actions: a single-arch (amd64) build on
# the standard ubuntu-latest runner.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Scrub gate (must pass before build)
        run: |
          chmod +x ./scrub-check.sh
          ./scrub-check.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Publish only on a public repo, and only for a push to the default branch or a tag.
      # On a private repo (this phase) and on pull requests, publish is false: build only.
      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ] \
             && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.decide.outputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and publish when public)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ steps.decide.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
