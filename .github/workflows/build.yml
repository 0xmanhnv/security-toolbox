name: build

# Builds the image on every push and pull request. When (and only when) the repository
# is PUBLIC and the event is a push to the default branch or a tag, it also publishes the
# image to this repository's own GHCR package. While the repository is private the publish
# step is skipped, so nothing is ever pushed to a public package by accident.
#
# Designed to run on a public repository's free Actions: a single-arch (amd64) build on
# the standard ubuntu-latest runner.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The content check must pass before anything is built or published. It fails
      # when the secret is missing (scrub-check.sh).
      - name: Scrub-check (must pass before build)
        env:
          SCRUB_TERMS: ${{ secrets.SCRUB_TERMS }}
        run: sh ./scrub-check.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Publish only on a public repo, and only for a push to the default branch or a tag.
      # On a private repo (this phase) and on pull requests, publish is false: build only.
      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event.repository.private }}" = "false" ] \
             && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.decide.outputs.publish == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and publish when public)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ steps.decide.outputs.publish == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
